services:
  wifi:
    build: .
    image: wifi:latest
    container_name: wifi
    ports:
      - "8000:80"
    depends_on:
      - mariadb
    networks:
      - wifi-network
    volumes:
      - ./:/var/www/html
    environment:
      HOME: /tmp
    user: "${UID:-1000}:${GID:-1000}"

  mariadb:
    image: mariadb:11
    container_name: wifi_mariadb
    restart: always
    environment:
      MYSQL_DATABASE: wifi
      MYSQL_USER: wifi
      MYSQL_PASSWORD: wifi
      MYSQL_ROOT_PASSWORD: wifi
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - wifi-network

  selenium:
    image: selenium/standalone-chrome
    container_name: wifi_selenium
    ports:
      - "7900:7900" # VNC (pra ver o browser rodando)
    networks:
      - wifi-network
    shm_size: 2gb
  
  senhaunica-faker:
    image: uspdev/senhaunica-faker
    container_name: wifi_senhaunica-faker
    ports:
      - "3141:3141"
    environment:
          - APP_URL=http://auth.local:3141
    networks:
      wifi-network:
        aliases:
          - auth.local

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: wifi_phpmyadmin
    restart: always
    depends_on:
      - mariadb
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: wifi
    networks:
      - wifi-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: wifi_mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Interface Web
    networks:
      - wifi-network

  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: wifi_freeradius
    restart: always
    # -X = modo debug (mostra cada requisição no log). Remova em produção.
    command: ["-X"]
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      RADIUS_SECRET: "MinhaChaveSecretRADIUS"
      RADIUS_DB_HOST: mariadb
      RADIUS_DB_NAME: wifi
      RADIUS_DB_USER: wifi
      RADIUS_DB_PASSWORD: wifi
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./freeradius/mods-enabled/sql:/etc/freeradius/mods-enabled/sql:ro
      - ./freeradius/sites-enabled/default:/etc/freeradius/sites-enabled/default:ro
    networks:
      - wifi-network
    depends_on:
      - mariadb

networks:
  wifi-network:

volumes:
  mariadb_data: