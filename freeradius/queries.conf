authorize_check_query = "\
    SELECT r.id, LOWER(REPLACE(REPLACE(v.client_mac, ':', ''), '-', '')) AS username, \
           'Cleartext-Password' AS attribute, \
           LOWER(REPLACE(REPLACE(v.client_mac, ':', ''), '-', '')) AS value, \
           ':=' AS op \
    FROM wifi_requests r \
    JOIN visitors v ON r.visitor_id = v.id \
    WHERE LOWER(REPLACE(REPLACE(v.client_mac, ':', ''), '-', '')) = LOWER(REPLACE(REPLACE('%{Calling-Station-Id}', ':', ''), '-', '')) \
      AND r.status = 'approved' \
      AND (r.expires_at IS NULL OR r.expires_at > NOW()) \
      AND r.deleted_at IS NULL \
      AND v.deleted_at IS NULL \
    LIMIT 1"